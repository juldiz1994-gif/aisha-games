<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ai_aisha_kz</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=DM+Sans:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0814; }

    #threeCanvas { position: fixed; inset: 0; z-index: 1; }

    /* ── Hint ── */
    #hint {
      position: fixed; bottom: 2.2rem; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem; letter-spacing: 0.1em;
      color: rgba(212,175,55,0.75);
      text-shadow: 0 0 12px rgba(212,175,55,0.4);
      pointer-events: none;
      transition: opacity 0.6s;
      text-align: center;
    }
    #hint.hide { opacity: 0; }

    /* ── ROOMS (HTML overlay) ── */
    .room {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.7s ease;
      font-family: 'Dancing Script', cursive;
    }
    .room.active { opacity: 1; pointer-events: auto; }

    .stage {
      width: min(520px, 95vw);
      height: min(390px, 74vh);
      border-radius: 12px;
      position: relative; overflow: hidden;
      box-shadow: 0 0 100px rgba(0,0,0,0.95), 0 0 40px rgba(0,0,0,0.7);
      border: 1px solid rgba(212,175,55,0.08);
    }
    .r-ceil  { position:absolute; top:0; left:0; right:0; height:32%; }
    .r-wall  { position:absolute; top:0; left:0; right:0; bottom:28%; }
    .r-floor { position:absolute; bottom:0; left:0; right:0; height:30%;
               border-top:1px solid rgba(255,255,255,0.04); }

    /* Lamp */
    .lamp { position:absolute; top:0; left:50%; transform:translateX(-50%);
            display:flex; flex-direction:column; align-items:center; z-index:3; }
    .lamp-w { width:2px; height:46px; }
    .lamp-b { width:56px; height:28px; border-radius:0 0 28px 28px; }

    /* Floor glow */
    .fglow {
      position:absolute; bottom:28%; left:50%; transform:translateX(-50%);
      width:200px; height:22px;
      background:radial-gradient(ellipse, var(--glow), transparent 70%);
      pointer-events:none;
    }

    .r-label {
      position:absolute; z-index:3;
      top:38%; left:50%; transform:translate(-50%,-50%);
      font-size:clamp(0.65rem,1.8vw,0.82rem);
      letter-spacing:0.22em;
    }

    .furn { position:absolute; z-index:3; pointer-events:none; line-height:1; }

    .nav {
      margin-top:1.4rem;
      font-family:'Dancing Script',cursive;
      font-size:1.05rem; letter-spacing:0.12em;
      color:rgba(212,175,55,0.7);
      background:none;
      border:1px solid rgba(212,175,55,0.35);
      border-radius:30px; padding:0.5rem 1.6rem;
      cursor:pointer; transition:all 0.3s;
    }
    .nav:hover { color:#D4AF37; border-color:rgba(212,175,55,0.75);
                 box-shadow:0 0 20px rgba(212,175,55,0.22); }

    @keyframes twinkle {
      from { opacity:0.25; transform:scale(0.85); }
      to   { opacity:0.75; transform:scale(1.15); }
    }

    /* Knob cursor hint */
    #knobCursor {
      position: fixed; z-index: 15;
      width: 44px; height: 44px;
      border: 2px solid rgba(212,175,55,0.7);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%,-50%);
      display: none;
      box-shadow: 0 0 14px rgba(212,175,55,0.4);
    }
    #knobCursor::after {
      content: '↻';
      position: absolute; top:50%; left:50%;
      transform:translate(-50%,-52%);
      font-size: 1.1rem; color: rgba(212,175,55,0.9);
    }
  </style>
</head>
<body>

<canvas id="threeCanvas"></canvas>
<div id="hint">есік тұтқасына мышканы апарыңыз ✦</div>
<div id="knobCursor"></div>

<!-- ROOM 1 -->
<div class="room" id="room1" style="background:linear-gradient(180deg,#120902,#080500);">
  <div class="stage">
    <div class="r-ceil" style="background:linear-gradient(180deg,#1a0d02,#2a1606);"></div>
    <div class="r-wall" style="background:linear-gradient(180deg,#2c1708,#3d1e08);"></div>
    <div class="r-floor" style="background:linear-gradient(180deg,#4e2c0a,#3a1e06);"></div>
    <div class="lamp">
      <div class="lamp-w" style="background:rgba(212,175,55,0.3);"></div>
      <div class="lamp-b" style="background:linear-gradient(180deg,rgba(212,175,55,0.85),rgba(212,175,55,0.15));box-shadow:0 0 60px rgba(212,175,55,0.5);"></div>
    </div>
    <div class="fglow" style="--glow:rgba(212,175,55,0.18);"></div>
    <div class="r-label" style="color:rgba(212,175,55,0.38);">✦ ЖҰМЫС БӨЛМЕСІ ✦</div>
    <div class="furn" style="bottom:29%;left:5%;font-size:clamp(2.4rem,6vw,3.2rem);">🛋️</div>
    <div class="furn" style="bottom:29%;right:6%;font-size:clamp(2rem,5vw,2.8rem);">💻</div>
    <div class="furn" style="bottom:29%;right:28%;font-size:clamp(1.6rem,4vw,2.2rem);">📚</div>
    <div class="furn" style="bottom:30%;left:34%;font-size:clamp(1.2rem,3vw,1.6rem);">🌿</div>
    <div class="furn" style="bottom:30%;right:44%;font-size:clamp(1rem,2.5vw,1.3rem);">☕</div>
    <div class="furn" style="top:14%;left:9%;font-size:clamp(1rem,2.5vw,1.4rem);opacity:0.5;">🖼️</div>
  </div>
  <button class="nav" id="toRoom2">екінші бөлме →</button>
</div>

<!-- ROOM 2 -->
<div class="room" id="room2" style="background:linear-gradient(180deg,#030710,#020408);">
  <div class="stage">
    <div class="r-ceil" style="background:linear-gradient(180deg,#03060f,#050918);"></div>
    <div class="r-wall" style="background:linear-gradient(180deg,#06101e,#0a1828);"></div>
    <div class="r-floor" style="background:linear-gradient(180deg,#0a1828,#061018);"></div>
    <div class="lamp">
      <div class="lamp-w" style="background:rgba(120,160,255,0.25);"></div>
      <div class="lamp-b" style="background:linear-gradient(180deg,rgba(120,160,255,0.7),rgba(120,160,255,0.12));box-shadow:0 0 60px rgba(120,160,255,0.4);"></div>
    </div>
    <div class="fglow" style="--glow:rgba(100,140,255,0.14);"></div>
    <div class="r-label" style="color:rgba(212,175,55,0.35);">✦ ЖАТЫН БӨЛМЕ ✦</div>
    <div class="furn" style="top:32%;left:50%;transform:translateX(-50%);text-align:center;">
      <div style="font-size:clamp(1.1rem,3vw,1.6rem);color:rgba(212,175,55,0.75);text-shadow:0 0 14px rgba(212,175,55,0.4);">ai_aisha_kz</div>
      <div style="font-size:0.55rem;letter-spacing:0.22em;color:rgba(212,175,55,0.3);margin-top:3px;">✦ &nbsp; ✦ &nbsp; ✦</div>
    </div>
    <div class="furn" style="bottom:29%;left:4%;font-size:clamp(2.2rem,5.5vw,3rem);">🛏️</div>
    <div class="furn" style="bottom:29%;right:6%;font-size:clamp(1.8rem,5vw,2.6rem);">🪞</div>
    <div class="furn" style="bottom:30%;left:44%;font-size:clamp(1.4rem,3vw,1.8rem);">🌸</div>
    <div class="furn" style="bottom:31%;right:28%;font-size:clamp(1rem,2.5vw,1.4rem);">🕯️</div>
    <div class="furn" style="top:15%;right:10%;font-size:1.1rem;animation:twinkle 2.2s ease-in-out infinite alternate;">✨</div>
    <div class="furn" style="top:20%;left:8%;font-size:0.85rem;animation:twinkle 1.7s ease-in-out infinite alternate 0.6s;opacity:0.5;">⭐</div>
  </div>
  <button class="nav" id="toExt">← үйге оралу</button>
</div>

<script>
// ════════════════════════════════
//   THREE.JS HOUSE SCENE
// ════════════════════════════════
const canvas   = document.getElementById('threeCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0a0814);
scene.fog = new THREE.FogExp2(0x0a0814, 0.04);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 3, 18);
camera.lookAt(0, 1, 0);

// ── Lights ──
const ambient = new THREE.AmbientLight(0xffeedd, 0.35);
scene.add(ambient);

const moon = new THREE.DirectionalLight(0xaab8e8, 0.6);
moon.position.set(-8, 12, 6);
moon.castShadow = true;
scene.add(moon);

const warmLight = new THREE.PointLight(0xffd580, 1.2, 18);
warmLight.position.set(0, 3, 3);
scene.add(warmLight);

// Window glow lights
const winGlow1 = new THREE.PointLight(0xffc840, 0.8, 6);
winGlow1.position.set(-1.8, 1.8, 2.6);
scene.add(winGlow1);
const winGlow2 = new THREE.PointLight(0xffc840, 0.8, 6);
winGlow2.position.set(1.8, 1.8, 2.6);
scene.add(winGlow2);

// ── Ground ──
const groundGeo = new THREE.PlaneGeometry(60, 60);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a0e06, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ── Sky gradient (simple gradient sphere) ──
const skyGeo = new THREE.SphereGeometry(80, 16, 8);
const skyMat = new THREE.MeshBasicMaterial({
  color: 0x0a0814,
  side: THREE.BackSide
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// Helper: make box mesh
function box(w, h, d, color, metalness=0.05, roughness=0.85) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.MeshStandardMaterial({ color, metalness, roughness });
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ── HOUSE GROUP ──
const houseGroup = new THREE.Group();
scene.add(houseGroup);

// Main wall (front)
const frontWall = box(6, 4, 0.25, 0xc8906a);
frontWall.position.set(0, 2, 2.75);
houseGroup.add(frontWall);

// Side walls
const sideL = box(0.25, 4, 5.5, 0xb07848);
sideL.position.set(-3, 2, 0);
houseGroup.add(sideL);
const sideR = box(0.25, 4, 5.5, 0xb07848);
sideR.position.set(3, 2, 0);
houseGroup.add(sideR);

// Back wall
const backWall = box(6, 4, 0.25, 0xa06838);
backWall.position.set(0, 2, -2.75);
houseGroup.add(backWall);

// Ceiling / floor
const ceilMesh = box(6, 0.2, 5.5, 0x8a5c30);
ceilMesh.position.set(0, 4.1, 0);
houseGroup.add(ceilMesh);
const floorMesh = box(6, 0.18, 5.5, 0x6b4422);
floorMesh.position.set(0, 0, 0);
houseGroup.add(floorMesh);

// ── ROOF ──
const roofShape = new THREE.Shape();
roofShape.moveTo(-3.5, 0);
roofShape.lineTo(0, 2.4);
roofShape.lineTo(3.5, 0);
roofShape.lineTo(-3.5, 0);
const roofExtSettings = { depth: 5.8, bevelEnabled: false };
const roofGeo  = new THREE.ExtrudeGeometry(roofShape, roofExtSettings);
const roofMat  = new THREE.MeshStandardMaterial({ color: 0x8a2424, roughness: 0.7 });
const roof     = new THREE.Mesh(roofGeo, roofMat);
roof.position.set(-3.5, 4.1, -2.9);
roof.rotation.y = 0;
roof.castShadow = true;
houseGroup.add(roof);

// Ridge cap
const ridgeCap = box(0.3, 0.3, 6, 0x6a1818);
ridgeCap.position.set(0, 6.5, 0);
houseGroup.add(ridgeCap);

// ── PORCH ──
const porchFloor = box(6.6, 0.18, 2, 0x7a4c28);
porchFloor.position.set(0, 0, 3.75);
houseGroup.add(porchFloor);

// Porch columns
[-2.4, 2.4].forEach(x => {
  const col = box(0.22, 3, 0.22, 0xd4b080);
  col.position.set(x, 1.5, 4.65);
  houseGroup.add(col);
});

// Porch roof
const porchRoof = box(6.6, 0.18, 2.1, 0x7a2020);
porchRoof.position.set(0, 3.1, 3.74);
houseGroup.add(porchRoof);

// Steps
const step1 = box(4, 0.2, 0.7, 0x8a6040);
step1.position.set(0, 0.1, 5.05);
houseGroup.add(step1);
const step2 = box(3.2, 0.2, 0.7, 0x9a7050);
step2.position.set(0, 0.3, 5.55);
houseGroup.add(step2);

// ── WINDOWS ──
function makeWindow(x, y, z) {
  const wg = new THREE.Group();

  // Frame
  const frame = box(1.2, 1.2, 0.08, 0xd4b080);
  wg.add(frame);

  // Glass (slightly inset)
  const glassGeo = new THREE.PlaneGeometry(0.9, 0.9);
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0xffc840, transparent: true, opacity: 0.35,
    emissive: 0xffa020, emissiveIntensity: 0.4,
    metalness: 0.1, roughness: 0.1
  });
  const glass = new THREE.Mesh(glassGeo, glassMat);
  glass.position.set(0, 0, 0.06);
  wg.add(glass);

  // Cross dividers
  const divH = box(0.9, 0.04, 0.06, 0xd4b080);
  wg.add(divH);
  const divV = box(0.04, 0.9, 0.06, 0xd4b080);
  wg.add(divV);

  wg.position.set(x, y, z);
  return wg;
}

houseGroup.add(makeWindow(-1.6, 2.2, 2.9));
houseGroup.add(makeWindow( 1.6, 2.2, 2.9));

// ── DOOR FRAME ──
const doorFrame = box(1.6, 2.8, 0.12, 0x8a5c2a);
doorFrame.position.set(0, 1.4, 2.82);
houseGroup.add(doorFrame);

// Door opening (dark interior visible through)
const doorHoleMat = new THREE.MeshStandardMaterial({
  color: 0x1a0d04, emissive: 0x1a0d04, emissiveIntensity: 0.2
});
const doorHole = new THREE.Mesh(new THREE.PlaneGeometry(1.28, 2.56), doorHoleMat);
doorHole.position.set(0, 1.28, 2.76);
houseGroup.add(doorHole);

// ── DOOR PANEL ──
const doorGroup = new THREE.Group();
doorGroup.position.set(-0.64, 0, 2.78); // left-hinge pivot

const doorPanel = box(1.3, 2.6, 0.08, 0x5a2808);
doorPanel.position.set(0.65, 1.3, 0);
doorGroup.add(doorPanel);

// Door detail (raised panel)
const panel1 = box(0.9, 1.0, 0.05, 0x4a1e04);
panel1.position.set(0.65, 1.82, 0.07);
doorGroup.add(panel1);
const panel2 = box(0.9, 0.9, 0.05, 0x4a1e04);
panel2.position.set(0.65, 0.7, 0.07);
doorGroup.add(panel2);

// ── DOOR KNOB (round) ──
const knobGeo  = new THREE.SphereGeometry(0.1, 16, 16);
const knobMat  = new THREE.MeshStandardMaterial({
  color: 0xD4AF37, metalness: 0.85, roughness: 0.15,
  emissive: 0xD4AF37, emissiveIntensity: 0.1
});
const knobMesh = new THREE.Mesh(knobGeo, knobMat);
knobMesh.position.set(1.15, 1.28, 0.12);
doorGroup.add(knobMesh);

// Knob rod
const rodGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.18, 8);
const rod    = new THREE.Mesh(rodGeo, knobMat);
rod.rotation.x = Math.PI / 2;
rod.position.set(1.15, 1.28, 0.05);
doorGroup.add(rod);

houseGroup.add(doorGroup);

// ── Stars ──
const starCount = 200;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.random() * Math.PI * 0.5;
  const r     = 60 + Math.random() * 10;
  starPositions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i*3+1] = r * Math.cos(phi) + 5;
  starPositions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({ color: 0xfff8e0, size: 0.25, sizeAttenuation: true });
scene.add(new THREE.Points(starGeo, starMat));

// ── SIGN on house ──
// (text via canvas texture)
function makeTextTexture(text, font, size, color, bg) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = bg || 'transparent';
  g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = color;
  g.font = `bold ${size}px ${font}`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = color;
  g.shadowBlur = 18;
  g.fillText(text, 256, 64);
  return new THREE.CanvasTexture(c);
}

const signTex = makeTextTexture('ai_aisha_kz', 'Dancing Script, cursive', 62, '#D4AF37');
const signGeo = new THREE.PlaneGeometry(3.2, 0.7);
const signMat = new THREE.MeshBasicMaterial({ map: signTex, transparent: true, side: THREE.FrontSide });
const signMesh = new THREE.Mesh(signGeo, signMat);
signMesh.position.set(0, 3.5, 2.92);
houseGroup.add(signMesh);

// ════════════════════════════════
//   INTERACTION: knob spinning
// ════════════════════════════════
const hintEl     = document.getElementById('hint');
const knobCursor = document.getElementById('knobCursor');
const room1El    = document.getElementById('room1');
const room2El    = document.getElementById('room2');
const toRoom2Btn = document.getElementById('toRoom2');
const toExtBtn   = document.getElementById('toExt');

const raycaster  = new THREE.Raycaster();
const mouse      = new THREE.Vector2();

let knobRotation  = 0;       // total degrees rotated
let prevMouseAngle = null;
let onKnob        = false;
let doorOpened    = false;
let doorAngle     = 0;       // degrees, max 100
let camPhase      = 0;       // 0=idle 1=zooming 2=done
let state         = 'ext';

// Target camera values
const camTarget = { x: 0, y: 1.4, z: 4.5, lookY: 1.2 };
let   camCurrent = { x: 0, y: 3, z: 18, lookY: 1 };

function getKnobScreenPos() {
  const pos = new THREE.Vector3();
  knobMesh.getWorldPosition(pos);
  pos.project(camera);
  return {
    x: (pos.x + 1) / 2 * window.innerWidth,
    y: (-pos.y + 1) / 2 * window.innerHeight
  };
}

document.addEventListener('mousemove', e => {
  if (doorOpened || state !== 'ext') return;

  // Raycaster — check if on knob
  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(knobMesh);

  if (hits.length > 0) {
    onKnob = true;
    document.body.style.cursor = 'none';
    knobCursor.style.display = 'block';
    knobCursor.style.left = e.clientX + 'px';
    knobCursor.style.top  = e.clientY + 'px';
    hintEl.classList.add('hide');

    // Compute rotation from mouse movement around knob center
    const kp = getKnobScreenPos();
    const angle = Math.atan2(e.clientY - kp.y, e.clientX - kp.x) * 180 / Math.PI;

    if (prevMouseAngle !== null) {
      let delta = angle - prevMouseAngle;
      if (delta >  180) delta -= 360;
      if (delta < -180) delta += 360;
      knobRotation += delta;
      // Spin the knob visually
      knobMesh.rotation.z = knobRotation * Math.PI / 180;
    }
    prevMouseAngle = angle;

    // Threshold: 140° rotation opens door
    if (Math.abs(knobRotation) > 140 && !doorOpened) {
      doorOpened = true;
      camPhase   = 1;
      knobCursor.style.display = 'none';
      document.body.style.cursor = 'default';
    }
  } else {
    if (onKnob) {
      onKnob = false;
      prevMouseAngle = null;
      knobCursor.style.display = 'none';
      document.body.style.cursor = 'default';
    }
  }
});

// ════════════════════════════════
//   ANIMATION LOOP
// ════════════════════════════════
const clock = new THREE.Clock();

function lerp(a, b, t) { return a + (b - a) * t; }

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // Gentle house idle bob (only when not zooming)
  if (camPhase === 0) {
    const t = clock.getElapsedTime();
    houseGroup.rotation.y = Math.sin(t * 0.2) * 0.02;
    camera.position.y = camCurrent.y + Math.sin(t * 0.3) * 0.04;
  }

  // Door opening animation
  if (doorOpened && doorAngle < 100) {
    doorAngle += dt * 65;
    doorAngle = Math.min(doorAngle, 100);
    doorGroup.rotation.y = -(doorAngle * Math.PI / 180);
  }

  // Camera zoom toward door
  if (camPhase === 1) {
    camCurrent.x = lerp(camCurrent.x, camTarget.x, dt * 1.4);
    camCurrent.y = lerp(camCurrent.y, camTarget.y, dt * 1.4);
    camCurrent.z = lerp(camCurrent.z, camTarget.z, dt * 1.4);
    camCurrent.lookY = lerp(camCurrent.lookY, camTarget.lookY, dt * 1.4);

    camera.position.set(camCurrent.x, camCurrent.y, camCurrent.z);
    camera.lookAt(0, camCurrent.lookY, 0);

    // When close enough → show room 1
    if (camCurrent.z < 5.5) {
      camPhase = 2;
      setTimeout(() => {
        room1El.classList.add('active');
        state = 'room1';
      }, 400);
    }
  }

  renderer.render(scene, camera);
}

animate();

// ── Room nav ──
toRoom2Btn.addEventListener('click', () => {
  if (state !== 'room1') return;
  state = 'transitioning';
  room1El.classList.remove('active');
  setTimeout(() => { room2El.classList.add('active'); state = 'room2'; }, 430);
});

toExtBtn.addEventListener('click', () => {
  if (state !== 'room2') return;
  state = 'transitioning';
  room2El.classList.remove('active');

  // Reset everything
  setTimeout(() => {
    camPhase     = 0;
    doorOpened   = false;
    doorAngle    = 0;
    knobRotation = 0;
    prevMouseAngle = null;
    doorGroup.rotation.y = 0;
    knobMesh.rotation.z  = 0;
    camCurrent = { x: 0, y: 3, z: 18, lookY: 1 };
    camera.position.set(0, 3, 18);
    camera.lookAt(0, 1, 0);
    hintEl.classList.remove('hide');
    state = 'ext';
  }, 430);
});

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
